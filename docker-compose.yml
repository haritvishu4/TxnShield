version: '3.8'

services:
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./fraud_audit.db:/app/fraud_audit.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  fraud-dashboard:
    build: .
    container_name: fraud-detection-dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - API_BASE_URL=http://fraud-api:8000
    depends_on:
      - fraud-api
    restart: unless-stopped
